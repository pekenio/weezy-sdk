name: Publish SDKs
on:
  workflow_dispatch:
    inputs:
      npm:
        description: Publish the npm package
        type: boolean
        default: false
      pypi:
        description: Publish the PyPI package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  npm:
    if: ${{ inputs.npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci && npm test
        working-directory: typescript
      - run: npm publish --access public --provenance
        working-directory: typescript
  pypi:
    if: ${{ inputs.pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./python build twine
      - run: python -m unittest discover -s python/tests
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
